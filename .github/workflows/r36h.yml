        run: |
          & "$env:GITHUB_WORKSPACE/_ci/ci/windows-runner.ps1" -Task checks
      - name: Share verified build support
        uses: actions/upload-artifact@v4
        with:
          name: r36h-build-support-${{ github.run_id }}
          path: ${{ env.R36H_STAGE }}/output/checks/r36h-build-support.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36h-check-log-${{ github.run_id }}
          path: ${{ env.R36H_STAGE }}/output/checks/build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove this job's Windows staging files
        if: always()
        run: |
          if (Test-Path -LiteralPath $env:R36H_STAGE) {
            Remove-Item -LiteralPath $env:R36H_STAGE -Recurse -Force
          }

  kernel:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Prepare this job's temporary path
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "r36h-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)-kernel"
          "R36H_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Checkout Windows build bridge
        uses: actions/checkout@v4
        with:
          path: _ci
          sparse-checkout: ci
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r36h-build-support-${{ github.run_id }}
          path: ${{ env.R36H_STAGE }}/input
      - name: Compile pinned wired-only kernel and panel references in Linux
        run: |
          & "$env:GITHUB_WORKSPACE/_ci/ci/windows-runner.ps1" -Task kernel
      - name: Upload kernel and configuration audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36h-kernel-${{ github.run_id }}
          path: ${{ env.R36H_STAGE }}/output/kernel/
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 14
      - name: Remove this job's Windows staging files
        if: always()
        run: |
          if (Test-Path -LiteralPath $env:R36H_STAGE) {
            Remove-Item -LiteralPath $env:R36H_STAGE -Recurse -Force
          }

  image:
    needs: [checks, kernel]
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'assemble' && needs.kernel.result == 'success'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Prepare this job's temporary path
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "r36h-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)-image"
          "R36H_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Checkout Windows build bridge
        uses: actions/checkout@v4
        with:
          path: _ci
          sparse-checkout: ci
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r36h-build-support-${{ github.run_id }}
          path: ${{ env.R36H_STAGE }}/input
      - uses: actions/download-artifact@v4
        with:
          name: r36h-kernel-${{ github.run_id }}
          path: ${{ env.R36H_STAGE }}/input/kernel
      - name: Assemble experimental SD image in Linux
        env:
          MODE: ${{ inputs.mode }}
          BASE_URL: ${{ inputs.base_url }}
          BASE_SHA: ${{ inputs.base_sha256 }}
          SYSTEM_URL: ${{ inputs.system_url }}
          SYSTEM_SHA: ${{ inputs.system_sha256 }}
          PANEL: ${{ inputs.panel }}
        run: |
          & "$env:GITHUB_WORKSPACE/_ci/ci/windows-runner.ps1" -Task image
      - name: Upload experimental image and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36h-sd-image-EXPERIMENTAL-${{ github.run_id }}
          path: ${{ env.R36H_STAGE }}/output/image/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove this job's Windows staging files
        if: always()
        run: |
          if (Test-Path -LiteralPath $env:R36H_STAGE) {
            Remove-Item -LiteralPath $env:R36H_STAGE -Recurse -Force
          }
