name: R36H GammaOS Core

on:
  push:
    branches: [develop, gammaos-core-r36h, r36h-build-ci]
    paths:
      - '.github/workflows/*.yml'
      - 'ci/**'
      - 'port/r36h/**'
      - 'device/gameconsole/r36h/**'
      - 'vendor/rockchip/common/bin/arm64/Android.bp'
  workflow_dispatch:
    inputs:
      mode:
        description: 'kernel: build Image and DTBs; assemble: combine with an existing GammaOS GSI'
        type: choice
        options: [kernel, assemble]
        default: kernel
        required: true
      base_url:
        description: 'Public HTTPS URL of a working Treble SD image with a separate vendor partition'
        type: string
        default: ''
      base_sha256:
        description: 'SHA-256 of the base download, including compression'
        type: string
        default: ''
      system_url:
        description: 'assemble only: HTTPS URL of an ARM64 GammaOS ext4/sparse system.img, ZIP or XZ'
        type: string
        default: ''
      system_sha256:
        description: 'assemble only: SHA-256 of the system download'
        type: string
        default: ''
      panel:
        description: 'Keep your base DTB unless its panel has been positively identified'
        type: choice
        options: [keep, '0', '1', '2', '3', '4', '5', '6']
        default: keep
        required: true

permissions:
  contents: read

concurrency:
  group: r36h-${{ github.ref }}-${{ github.event.inputs.mode }}
  cancel-in-progress: false

defaults:
  run:
    shell: powershell

env:
  SUPPORT_SHA256: 3a68bd41578e3f08278cf35a5bc1f74002f0c29ac760a25c15b11bc2999a229d
  R36H_RUNTIME: ${{ vars.R36H_RUNTIME || 'auto' }}
  R36H_WSL_DISTRO: ${{ vars.R36H_WSL_DISTRO }}
  BUILD_JOBS: ${{ vars.R36H_BUILD_JOBS || '4' }}

jobs:
  checks:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Prepare this job's temporary path
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "r36h-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)-checks"
          "R36H_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Checkout Windows build bridge
        uses: actions/checkout@v4
        with:
          path: _ci
          sparse-checkout: ci
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Check scripts and exercise the image packager in Linux
        env:
          MODE: ${{ inputs.mode || 'kernel' }}
          BASE_URL: ${{ inputs.base_url }}
          BASE_SHA: ${{ inputs.base_sha256 }}
          SYSTEM_URL: ${{ inputs.system_url }}
          SYSTEM_SHA: ${{ inputs.system_sha256 }}
          SUPPORT_ZIP: >-
