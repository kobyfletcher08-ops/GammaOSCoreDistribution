name: R36H full image inputs

on:
  push:
    branches: [r36h-build-ci]
    paths:
      - '.github/workflows/r36h-full-image.yml'
      - 'ci/image-inputs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r36h-full-image-inputs
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          path: _ci_image
          sparse-checkout: ci/image-inputs
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect public SD base and GammaOS system inputs in WSL
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP "r36h-image-inputs-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          "IMAGE_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          foreach ($file in @('run.sh', 'inspect.py')) {
            $source = Join-Path $env:GITHUB_WORKSPACE "_ci_image/ci/image-inputs/$file"
            $content = [IO.File]::ReadAllText($source).Replace("`r`n", "`n")
            [IO.File]::WriteAllText((Join-Path $stage $file), $content, $utf8)
          }
          $config = @{
            base_url = 'https://media.githubusercontent.com/media/andr36oid/release_uploads/6e667392e9ad04366252acd0db47e9af3f966939/lineage-18.1-20260316-1753-r36s-android.img.zip'
            base_sha256 = '66afe0c52ce9476a55920a181528bff1af7af3168a3bd14ed627723925360344'
            gamma_url = 'https://github.com/TheGammaSqueeze/GammaOSCore/releases/download/beta3/GammaOS_Core_Beta3_RG_353.7z'
            gamma_password = '58n495cn98n489roi45m945m0k509kf0495'
          }
          [IO.File]::WriteAllText((Join-Path $stage 'sources.json'), ($config | ConvertTo-Json), $utf8)
          $linuxStage = (& wsl.exe -d Ubuntu-24.04 -u root --exec wslpath -a -u $stage | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot access Ubuntu-24.04 under the runner account.' }
          & wsl.exe -d Ubuntu-24.04 -u root --exec bash "$linuxStage/run.sh" $linuxStage
          if ($LASTEXITCODE -ne 0) { throw 'Image input inspection failed. See the input report artifact for the exact blocker.' }
      - name: Upload input inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36h-full-image-input-report-${{ github.run_id }}
          path: ${{ env.IMAGE_STAGE }}/output/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove this run's Windows staging files
        if: always()
        run: |
          if ($env:IMAGE_STAGE -and (Test-Path -LiteralPath $env:IMAGE_STAGE)) {
            Remove-Item -LiteralPath $env:IMAGE_STAGE -Recurse -Force
          }
