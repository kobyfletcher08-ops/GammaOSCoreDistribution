name: R36H native GammaOS image

on:
  push:
    branches: [r36h-build-ci]
    paths:
      - '.github/workflows/r36h-native.yml'
      - 'ci/native/**'
      - 'port/r36h/**'
      - 'device/gameconsole/r36h/**'
      - 'vendor/rockchip/common/bin/arm64/Android.bp'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build the full native SD image or prepare sources only'
        type: choice
        options: [full, source]
        default: full

permissions:
  contents: read

concurrency:
  group: r36h-native-image
  cancel-in-progress: false

env:
  BUILD_JOBS: ${{ vars.R36H_BUILD_JOBS || '32' }}
  ANDROID_BUILD_JOBS: ${{ vars.R36H_ANDROID_BUILD_JOBS || '32' }}

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 720
    defaults:
      run:
        shell: powershell
    steps:
      - name: Prepare independent GammaOS sources in Ubuntu
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP "r36h-native-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          "NATIVE_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $bootstrap = @'
          #!/usr/bin/env bash
          set -euo pipefail
          stage=$(realpath -- "$1")
          revision=$2
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          ci=/var/cache/gammaos-r36h-native/ci/$revision
          mkdir -p "$ci"
          if [[ ! -d "$ci/.git" ]]; then
              git -C "$ci" init
              git -C "$ci" remote add origin https://github.com/kobyfletcher08-ops/GammaOSCoreDistribution.git
              git -C "$ci" fetch --no-tags --depth=1 origin "$revision"
              git -C "$ci" -c core.autocrlf=false checkout --detach "$revision"
          fi
          bash "$ci/ci/native/prepare.sh" "$stage"
          '@
          [IO.File]::WriteAllText((Join-Path $stage 'bootstrap.sh'), $bootstrap.Replace("`r`n", "`n"), $utf8)
          $linuxStage = (& wsl.exe -d Ubuntu-24.04 -u root --exec wslpath -a -u $stage | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Ubuntu-24.04 is not accessible to the runner account.' }
          & wsl.exe -d Ubuntu-24.04 -u root --exec bash "$linuxStage/bootstrap.sh" $linuxStage $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Native source preparation failed; see the diagnostic artifact.' }
      - name: Build the independent Rockchip kernel and native U-Boot
        if: github.event.inputs.mode != 'source'
        run: |
          $ErrorActionPreference = 'Stop'
          $linuxStage = (& wsl.exe -d Ubuntu-24.04 -u root --exec wslpath -a -u $env:NATIVE_STAGE | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot map the staging directory.' }
          $driver = "/var/cache/gammaos-r36h-native/ci/$($env:GITHUB_SHA)/ci/native/run_stage.sh"
          & wsl.exe -d Ubuntu-24.04 -u root --exec env "BUILD_JOBS=$($env:BUILD_JOBS)" bash $driver $linuxStage kernel
          if ($LASTEXITCODE -ne 0) { throw 'Native kernel/bootloader build failed; see kernel.log.' }
      - name: Validate Android product and install rules
        if: github.event.inputs.mode != 'source'
        run: |
          $ErrorActionPreference = 'Stop'
          $linuxStage = (& wsl.exe -d Ubuntu-24.04 -u root --exec wslpath -a -u $env:NATIVE_STAGE | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot map the staging directory.' }
          $driver = "/var/cache/gammaos-r36h-native/ci/$($env:GITHUB_SHA)/ci/native/run_stage.sh"
          & wsl.exe -d Ubuntu-24.04 -u root --exec env "ANDROID_BUILD_JOBS=$($env:ANDROID_BUILD_JOBS)" bash $driver $linuxStage android-check
          if ($LASTEXITCODE -ne 0) { throw 'Android product validation failed; see android-check.log.' }
      - name: Build GammaOS Android, vendor and first-stage ramdisk from source
        if: github.event.inputs.mode != 'source'
        run: |
          $ErrorActionPreference = 'Stop'
          $linuxStage = (& wsl.exe -d Ubuntu-24.04 -u root --exec wslpath -a -u $env:NATIVE_STAGE | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot map the staging directory.' }
          $driver = "/var/cache/gammaos-r36h-native/ci/$($env:GITHUB_SHA)/ci/native/run_stage.sh"
          & wsl.exe -d Ubuntu-24.04 -u root --exec env "ANDROID_BUILD_JOBS=$($env:ANDROID_BUILD_JOBS)" bash $driver $linuxStage android
          if ($LASTEXITCODE -ne 0) { throw 'Native Android build failed; see android.log.' }
      - name: Assemble and verify the complete SD image
        if: github.event.inputs.mode != 'source'
        run: |
          $ErrorActionPreference = 'Stop'
          $linuxStage = (& wsl.exe -d Ubuntu-24.04 -u root --exec wslpath -a -u $env:NATIVE_STAGE | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot map the staging directory.' }
          $driver = "/var/cache/gammaos-r36h-native/ci/$($env:GITHUB_SHA)/ci/native/run_stage.sh"
          & wsl.exe -d Ubuntu-24.04 -u root --exec bash $driver $linuxStage image
          if ($LASTEXITCODE -ne 0) { throw 'Native image verification failed; see image.log.' }
      - name: Upload the full native experimental image
        if: success() && github.event.inputs.mode != 'source'
        uses: actions/upload-artifact@v4
        with:
          name: GammaOS-Core-R36H-NATIVE-EXPERIMENTAL-${{ github.run_id }}
          path: ${{ env.NATIVE_STAGE }}/output/image/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload build diagnostics and native kernel outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r36h-native-diagnostics-${{ github.run_id }}
          path: |
            ${{ env.NATIVE_STAGE }}/output/*.log
            ${{ env.NATIVE_STAGE }}/output/*.json
            ${{ env.NATIVE_STAGE }}/output/*.txt
            ${{ env.NATIVE_STAGE }}/output/kernel/
            ${{ env.NATIVE_STAGE }}/output/bootloader/
            ${{ env.NATIVE_STAGE }}/output/android/
          retention-days: 14
          if-no-files-found: warn
      - name: Remove this run's Windows staging files
        if: always()
        run: |
          if ($env:NATIVE_STAGE -and (Test-Path -LiteralPath $env:NATIVE_STAGE)) {
            Remove-Item -LiteralPath $env:NATIVE_STAGE -Force -Recurse
          }

